apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-demo
  labels:
    app: spring-boot-demo # 用於識別與分類此 Deployment 的標籤
spec:
  replicas: 2 # 部署 2 個 Pod 副本以實現高可用與負載分餾
  selector:
    matchLabels:
      app: spring-boot-demo # 告訴 Deployment 要管理哪些帶有此標籤的 Pod
  template:
    metadata:
      labels:
        app: spring-boot-demo # Pod 的標籤，必須與 selector 匹配
    spec:
      # ==========================================
      # Pod 層級資安設定 (SecurityContext)
      # ==========================================
      securityContext:
        runAsNonRoot: true # 強制阻止以 root (UID 0) 身份運行容器；若容器預設為 root 則拒絕啟動
        runAsUser: 1000 # 強制指定容器內主要進程以 UID 1000 (appuser) 身份執行
        runAsGroup: 1000 # 強制指定容器內主要進程以 GID 1000 (appgroup) 身份執行
        fsGroup: 1000 # 自動將所有掛載 Volume 的檔案擁有群組設定為 GID 1000，確保寫入權限

      containers:
        - name: spring-boot-demo
          image: j9686/spring-boot-demo-app:1810d5ebb26c91050d186d71b30f1bc5f900bdf7
          imagePullPolicy: IfNotPresent # 本地若已有對應映像檔則優先採用，無才從 Registry 下載
          ports:
            - containerPort: 8080 # 宣告容器內 Spring Boot 應用程式監聽的埠號

          # ==========================================
          # 容器層級資安設定 (SecurityContext)
          # ==========================================
          securityContext:
            allowPrivilegeEscalation: false # 鎖定進程，不允許透過 setuid/setgid 等機制提升權限
            readOnlyRootFilesystem: true # 將容器根檔案系統設為「唯讀」，防止惡意程式寫入或修改系統檔案
            capabilities:
              drop:
                - ALL # 丟棄 Linux 所有特權 Capabilities（如 CAP_SYS_ADMIN 等），貫徹最小權限原則

          # ==========================================
          # 資源限制與分配 (Resources)
          # ==========================================
          resources:
            limits:
              cpu: "1" # 限制上限最多使用 1 個 CPU 核
              memory: 512Mi # 限制記憶體上限 512 MiB，超過會觸發 OOM KILLED
            requests:
              cpu: 500m # 預設調度保證分配 0.5 個 CPU 核 (500 millicores)
              memory: 256Mi # 預設調度保證分配 256 MiB 記憶體

          # ==========================================
          # 磁碟區掛載 (Volume Mounts)
          # ==========================================
          volumeMounts:
            # 由於 readOnlyRootFilesystem 設為 true，Spring Boot (嵌入式 Tomcat) 預設需要寫入 /tmp 目錄，
            # 此處額外掛載一個可寫入的記憶體型暫存區以維持正常運作
            - name: tmp-volume
              mountPath: /tmp

          # ==========================================
          # 健康檢查與存活機制 (Probes)
          # ==========================================
          livenessProbe: # 存活探針：檢測應用程式是否崩潰或無回應。若失敗，K8s 會自動重啟容器
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30 # 容器啟動後等待 30 秒才開始第一次檢查（給予 Java 啟動時間）
            periodSeconds: 10 # 每 10 秒檢查一次

          readinessProbe: # 就緒探針：檢測應用程式是否已準備好接收流量。若失敗，流量將不會導入該 Pod
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15 # 容器啟動後等待 15 秒開始檢查
            periodSeconds: 5 # 每 5 秒檢查一次

      # ==========================================
      # 磁碟區定義 (Volumes)
      # ==========================================
      volumes:
        - name: tmp-volume
          emptyDir: {} # 建立臨時目錄，生命週期與 Pod 綁定，當 Pod 刪除時隨之清理
---
apiVersion: v1
kind: Service
metadata:
  name: spring-boot-demo-service # Kubernetes 內部服務的 DNS 名稱
spec:
  selector:
    app: spring-boot-demo # 透過 Label Selector 將請求自動負載平衡分發至對應的 Pod
  ports:
    - protocol: TCP
      port: 8080 # 外部可存取的服務連接埠 (Service Port) - 對應 Docker Desktop localhost:8080
      targetPort: 8080 # 映射至後端容器實際監聽的連接埠 (Container Port)
  type: LoadBalancer # 改為 LoadBalancer 以利在 Docker Desktop 中直接對外暴露服務
