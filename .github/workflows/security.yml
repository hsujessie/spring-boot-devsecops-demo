name: DevSecOps Spring Boot Pipeline

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "ARCHITECTURE.md"
      - "DOCKER_K8S_GUIDE.md"
      - "local_k8s_setup.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "ARCHITECTURE.md"
      - "DOCKER_K8S_GUIDE.md"
      - "local_k8s_setup.md"

jobs:
  build-and-security-scan:
    name: Build Java & Security Scan
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      # 1. Checkout 原始碼 (鎖定 Commit SHA 避免供應鏈攻擊)
      - name: 1. Checkout Code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v3.6.0
        with:
          fetch-depth: 0

      # 2. 設定 JDK 26 環境
      - name: 2. Set up JDK 26
        uses: actions/setup-java@0ab4596768b603586c0de567f2430c30f5b0d2b0 # v3.13.0
        with:
          java-version: "26"
          distribution: "temurin"
          cache: maven

      # 3. SAST 原始碼邏輯掃描 (Semgrep)
      - name: 3. SAST Scan (Semgrep)
        run: |
          docker run --rm -v $(pwd):/src returntocorp/semgrep semgrep --config=auto /src

      # 4. SCA 快速掃描 (Trivy for pom.xml — 提供開發端 Fast Feedback)
      - name: 4. Fast SCA Scan (pom.xml)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "pom.xml"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      # 5. Maven 自動化打包 (編譯出 target/*.jar)
      - name: 5. Build Package with Maven
        run: ./mvnw clean package -DskipTests

      # 6. SCA 深度二進位檔掃描 (符合甲方與稽核標準 — 針對 BOOT-INF/lib 解包掃描)
      - name: 6. Deep SCA Scan (BOOT-INF/lib Binary Audit)
        run: |
          # 解開 Spring Boot JAR 檔
          mkdir -p target/extracted-app
          unzip -q target/*.jar -d target/extracted-app

      - name: 6b. Run Trivy on Extracted BOOT-INF/lib
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: "rootfs"
          scan-ref: "./target/extracted-app/BOOT-INF/lib" # 👈 精準指名掃描實體 .jar 庫
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      # ───【 第二階段新新增：容器安全 】───
      # 7. 打包 Docker Image (使用 Docker Hub 格式命名)
      - name: 7. Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-demo-app:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-demo-app:latest .

      # 8. 容器鏡像掃描 (Trivy for Container OS & Base Image)
      - name: 8. Container Image Scan (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: "image"
          image-ref: "${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-demo-app:${{ github.sha }}"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      # 9. 登入 Docker Hub (僅在推送到 main 分支時執行)
      - name: 9. Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 10. 推送 Docker 映像檔至 Docker Hub (僅在推送到 main 分支時執行)
      - name: 10. Push Docker Image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-demo-app:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-demo-app:latest

      # 11. 使用 Helm 部署至本地 Kubernetes 叢集 (僅在推送到 main 分支時執行)
      - name: 11. Deploy with Helm to Local Kubernetes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # 執行 Helm 升級與部署，動態帶入 Docker Hub 帳號與最新 Commit SHA 作為 Image Tag
          helm upgrade --install spring-boot-demo ./charts/spring-boot-demo \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-demo-app \
            --set image.tag=${{ github.sha }}
