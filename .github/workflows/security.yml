name: DevSecOps Spring Boot Pipeline

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "ARCHITECTURE.md"
      - "DOCKER_K8S_GUIDE.md"
      - "local_k8s_setup.md"
      - "charts/spring-boot-demo/values.yaml"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "ARCHITECTURE.md"
      - "DOCKER_K8S_GUIDE.md"
      - "local_k8s_setup.md"
      - "charts/spring-boot-demo/values.yaml"

jobs:
  build-and-security-scan:
    name: Build Java & Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout 原始碼 (鎖定 Commit SHA 避免供應鏈攻擊)
      - name: 1. Checkout Code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v3.6.0
        with:
          fetch-depth: 0

      # 1.5 淨化與設定 Docker Hub 使用者名稱
      - name: 1.5 Setup Docker Hub Username
        run: |
          USER_RAW="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$USER_RAW" ]; then
            USER_CLEAN="j9686"
          else
            USER_CLEAN=$(echo "$USER_RAW" | tr -d '\r' | xargs | tr '[:upper:]' '[:lower:]')
          fi
          echo "DOCKERHUB_USER=$USER_CLEAN" >> $GITHUB_ENV

      # 2. 設定 JDK 26 環境
      - name: 2. Set up JDK 26
        uses: actions/setup-java@0ab4596768b603586c0de567f2430c30f5b0d2b0 # v3.13.0
        with:
          java-version: "26"
          distribution: "temurin"
          cache: maven

      # 3. SAST 原始碼邏輯掃描 (Semgrep)
      - name: 3. SAST Scan (Semgrep)
        run: |
          docker run --rm -v $(pwd):/src returntocorp/semgrep semgrep --config=auto /src

      # 4. SCA 快速掃描 (Trivy for pom.xml — 提供開發端 Fast Feedback)
      - name: 4. Fast SCA Scan (pom.xml)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "pom.xml"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      # 5. Maven 自動化打包 (編譯出 target/*.jar)
      - name: 5. Build Package with Maven
        run: ./mvnw clean package -DskipTests

      # 6. SCA 深度二進位檔掃描 (符合甲方與稽核標準 — 針對 BOOT-INF/lib 解包掃描)
      - name: 6. Deep SCA Scan (BOOT-INF/lib Binary Audit)
        run: |
          # 解開 Spring Boot JAR 檔
          mkdir -p target/extracted-app
          unzip -q target/*.jar -d target/extracted-app

      - name: 6b. Run Trivy on Extracted BOOT-INF/lib
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: "rootfs"
          scan-ref: "./target/extracted-app/BOOT-INF/lib" # 👈 精準指名掃描實體 .jar 庫
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      # ───【 第二階段新新增：容器安全 】───
      # 7. 打包 Docker Image (使用 Docker Hub 格式命名)
      - name: 7. Build Docker Image
        run: |
          docker build -t ${{ env.DOCKERHUB_USER }}/spring-boot-demo-app:${{ github.sha }} -t ${{ env.DOCKERHUB_USER }}/spring-boot-demo-app:latest .

      # 8. 容器鏡像掃描 (Trivy for Container OS & Base Image)
      - name: 8. Container Image Scan (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: "image"
          image-ref: "${{ env.DOCKERHUB_USER }}/spring-boot-demo-app:${{ github.sha }}"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      # 9. 登入 Docker Hub (僅在推送到 main 分支時執行)
      - name: 9. Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 10. 推送 Docker 映像檔至 Docker Hub (僅在推送到 main 分支時執行)
      - name: 10. Push Docker Image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.DOCKERHUB_USER }}/spring-boot-demo-app:${{ github.sha }}
          docker push ${{ env.DOCKERHUB_USER }}/spring-boot-demo-app:latest

      # 11. 自動更新 Helm values.yaml 映像檔 Tag 並寫回 (僅在推送到 main 分支時執行 — GitOps)
      - name: 11. Update values.yaml & Git Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # 使用 sed 動態替換 values.yaml 中的 image.tag 欄位
          sed -i 's|tag:.*|tag: "${{ github.sha }}"|g' charts/spring-boot-demo/values.yaml

          # 設定 Git 資訊並提交推回
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/spring-boot-demo/values.yaml
          git commit -m "chore(deploy): update deployment image tag to ${{ github.sha }} [skip ci]"
          git pull --rebase origin main
          git push
